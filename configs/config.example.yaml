# 配置样例。复制为 config.yaml 并按环境修改：
#   cp configs/config.example.yaml configs/config.yaml
# 或使用环境变量 YF_ 前缀覆盖（如 YF_DATABASE_PASSWORD、YF_AUTH_JWT_SECRET）。
server:
  port: 8080
  mode: debug            # debug / release
  cors_allow_origins:    # 前端跨域白名单（开发默认放行；生产必须限定具体域名，如 https://pharmacy.example.com）
    - "*"

database:
  host: 127.0.0.1
  port: 5432
  user: yaofang
  password: "CHANGE_ME"            # 数据库密码（生产用环境变量覆盖）
  name: yaofang
  sslmode: disable                 # disable / require（云数据库建议 require）
  # ── 连接池（高并发调优见 docs/10 §9）──
  max_open_conns: 20               # 最大打开连接数（≈ 数据库 max_connections 预留后的可分配份额）
  max_idle_conns: 10               # 最大空闲连接数（≤ max_open_conns，0 = 不保留空闲）
  conn_max_lifetime: 1h            # 连接最大存活时长（建议 < 数据库/网关的会话超时）
  conn_max_idle_time: 30m          # 空闲连接回收时长

auth:
  jwt_secret: "example-only-secret-please-override-32chars"  # JWT 密钥（≥32 位），生产必须改为强随机串（openssl rand -base64 48）
  token_ttl: 720h

scheduler:
  enabled: true
  expiry_warning_cron: "0 7 * * *"   # 每日 07:00 效期预警
  expired_lock_cron: "0 0 * * *"     # 每日 00:00 过期锁定
  stock_warning_cron: "0 7 * * *"    # 每日 07:00 上下限预警

stock:
  default_expiry_warning_days: 90

log:
  level: info                    # debug / info / warn / error
  format: json                   # text / json（生产建议 json，供日志聚合直接解析）
  file: ""                       # 输出文件路径；空 = stdout（容器内务必保持空）
