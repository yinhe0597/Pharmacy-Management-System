# 镜像构建与推送：main 分支 / v* 标签 / 手动触发
# 产物推送到 GHCR（GitHub Container Registry）：
#   ghcr.io/<owner>/<repo>/yaofang-api       后端
#   ghcr.io/<owner>/<repo>/yaofang-web       前端（Nginx）
#   ghcr.io/<owner>/<repo>/yaofang-migrate   迁移镜像（K8s Job 用）
# 仓库需开启 Actions → General → Workflow permissions → Read and write permissions。
name: Docker Image Build & Push

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 QEMU + Buildx（多架构）
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 构建并推送 后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/yaofang-api:latest
            ${{ env.IMAGE_PREFIX }}/yaofang-api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/yaofang-api:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILDTIME=${{ github.event.head_commit.timestamp }}

      - name: 构建并推送 前端镜像
        uses: docker/build-push-action@v6
        with:
          context: pharmacy-web
          file: pharmacy-web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/yaofang-web:latest
            ${{ env.IMAGE_PREFIX }}/yaofang-web:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/yaofang-web:${{ github.ref_name }}

      - name: 构建并推送 迁移镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.migrate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/yaofang-migrate:latest
            ${{ env.IMAGE_PREFIX }}/yaofang-migrate:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/yaofang-migrate:${{ github.ref_name }}
