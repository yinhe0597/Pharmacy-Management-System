name: CI

on:
  push:
    # 主干已统一为 main。历史上踩过的坑：分支名与实际推送分支不一致时，
    # 流水线整体不触发，「CI 全绿」一度形同虚设。改分支名务必同步这里。
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yaofang
          POSTGRES_PASSWORD: yaofang123
          POSTGRES_DB: yaofang
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yaofang"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'   # 与 go.mod 保持一致
          cache: true

      - name: 安装 PostgreSQL 客户端
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: 执行数据库迁移（增量 + 版本表）
        env:
          PGPASSWORD: yaofang123
          PGHOST: localhost
          PGUSER: yaofang
          PGDATABASE: yaofang
          MIGRATIONS_DIR: migrations
        run: sh scripts/migrate.sh

      - name: 编译产物（含版本注入）
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w \
            -X yaofang/internal/version.Version=${GITHUB_REF_NAME} \
            -X yaofang/internal/version.Commit=${GITHUB_SHA::7}" \
            -o /tmp/yaofang-check ./cmd/server

      - name: 三个 Dockerfile 均可构建（防 COPY 目标被 .dockerignore 排除）
        # 迁移镜像曾因 .dockerignore 排除 scripts/ 而构建失败，而报错是
        # 「failed to compute cache key ... /scripts/migrate.sh: not found」——
        # 与真实原因（构建上下文缺文件）相距甚远，本地只测后端镜像时完全看不到。
        # 故把三份 Dockerfile 都纳入门禁：单架构快速验证，不推 registry。
        run: |
          docker build -q -t ci-check-api     -f Dockerfile                 .
          docker build -q -t ci-check-web     -f pharmacy-web/Dockerfile    pharmacy-web
          docker build -q -t ci-check-migrate -f deploy/Dockerfile.migrate  .

      - name: 静态检查（vet + 格式）
        run: |
          go vet ./...
          gofmt -l . | tee /dev/stderr
          test -z "$(gofmt -l .)"

      - name: golangci-lint（docs/06 CI 门槛）
        uses: golangci/golangci-lint-action@v8
        with:
          # ⚠️ 版本必须 ≥ v2.13：官方预编译二进制的构建 Go 版本若低于项目 go.mod 的
          # 1.26.6，lint 会直接报 "the Go language version used to build golangci-lint
          # is lower than the targeted Go version" 而失败。
          # 实测：v2.1.6 预编译 = go1.24.2 构建（不够）；v2.14.0 = go1.27.0 构建（可以）。
          version: v2.14.0
          # ⚠️ action 主版本也必须与 lint 主版本匹配：
          #   action v6 仅支持 lint v1（v7 专门加了 restrict v6 on v1）；v7 仅 v2；v8 起要求 lint >= v2.1.0
          args: --timeout=5m

      - name: 单元测试
        run: go test ./...

      - name: 集成测试（真实 PostgreSQL：service + HTTP 层）
        run: go test -tags=integration -count=1 ./internal/service/ ./internal/handler/
        env:
          YF_TEST_DB_HOST: localhost
          YF_TEST_DB_USER: yaofang
          YF_TEST_DB_PASSWORD: yaofang123
          YF_TEST_DB_NAME: yaofang

      - name: 覆盖率门槛（domain≥85% / service≥35% / repository≥20% / handler≥10%）
        run: bash scripts/check_coverage.sh
        env:
          YF_TEST_DB_HOST: localhost
          YF_TEST_DB_USER: yaofang
          YF_TEST_DB_PASSWORD: yaofang123
          YF_TEST_DB_NAME: yaofang

      - name: Swagger 文档一致性
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g cmd/server/main.go -o docs --parseDependency --parseInternal
          git diff --exit-code docs/ || (echo "Swagger 文档与代码不一致，请运行 make swag 后提交" && exit 1)
