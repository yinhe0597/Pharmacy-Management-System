name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: pharmacy-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pharmacy-web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（vue-tsc）
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Prettier 格式校验
        run: npm run format:check

      - name: 单元测试（vitest）
        run: npm run test

      - name: 构建
        run: npm run build
