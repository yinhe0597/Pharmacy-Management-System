name: Frontend CI

on:
  push:
    # 主干已统一为 main。历史上踩过的坑：分支名与实际推送分支不一致时流水线不触发。
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: pharmacy-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 必须 checkout 整个仓库：src/types/contract.test.ts 的前后端字段契约守卫
      # 要读 ../internal 下后端 struct 的 json tag，只 checkout pharmacy-web/ 会失败
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pharmacy-web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（vue-tsc）
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Prettier 格式校验
        run: npm run format:check

      - name: 单元测试（vitest）
        run: npm run test

      - name: 构建
        run: npm run build
