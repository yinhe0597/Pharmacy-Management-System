host: localhost:8080
info:
  contact: {}
  description: 药房进销存与处方调配后端服务
  title: 药房管理系统 API
  version: 1.5.0
paths:
  /adverse-reactions:
    get:
      parameters:
      - description: 药品ID
        in: query
        name: drug_id
        type: integer
      - description: 关键字
        in: query
        name: keyword
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数
        in: query
        name: page_size
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 不良反应列表
      tags:
      - adverse-reactions
    post:
      consumes:
      - application/json
      parameters:
      - description: 登记记录
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/yaofang_internal_model.AdverseReaction'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 新建不良反应登记
      tags:
      - adverse-reactions
  /adverse-reactions/{id}:
    delete:
      parameters:
      - description: 登记ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 删除不良反应登记
      tags:
      - adverse-reactions
    put:
      parameters:
      - description: 登记ID
        in: path
        name: id
        required: true
        type: integer
      - description: 登记记录
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/yaofang_internal_model.AdverseReaction'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 更新不良反应登记
      tags:
      - adverse-reactions
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 账号密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      summary: 登录
      tags:
      - auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 登出
      tags:
      - auth
  /auth/password:
    put:
      consumes:
      - application/json
      parameters:
      - description: 新旧密码
