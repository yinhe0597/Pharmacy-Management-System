basePath: /api/v1
definitions:
  internal_handler.Body:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  internal_handler.adjustRequest:
    properties:
      inventory_id:
        type: integer
      quantity:
        type: integer
      reason:
        type: string
    required:
    - inventory_id
    - quantity
    type: object
  internal_handler.bindDrugSupplierRequest:
    properties:
      is_default:
        type: boolean
      purchase_price:
        type: integer
      supplier_id:
        type: integer
    required:
    - supplier_id
    type: object
  internal_handler.confirmDispenseRequest:
    properties:
      checker_id:
        type: integer
    type: object
  internal_handler.createOrderRequest:
    properties:
      expected_at:
        type: string
      items:
        items:
          $ref: '#/definitions/yaofang_internal_service.POItemInput'
        type: array
      remarks:
        type: string
      supplier_id:
        type: integer
    required:
    - items
    - supplier_id
    type: object
  internal_handler.createStocktakeRequest:
    properties:
      location_id:
        type: integer
      type:
        description: 1周期 2动态
        enum:
        - 1
        - 2
        type: integer
    required:
    - location_id
    - type
    type: object
  internal_handler.createUserRequest:
    properties:
      name:
        type: string
      password:
        type: string
      phone:
        type: string
      role:
        type: string
      username:
        type: string
    required:
    - name
    - password
    - role
    - username
    type: object
  internal_handler.enterCountedRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/yaofang_internal_service.CountedItem'
        type: array
    required:
    - items
    type: object
  internal_handler.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  internal_handler.receiveRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/yaofang_internal_service.ReceiveItemInput'
        type: array
    required:
    - items
    type: object
  internal_handler.returnRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/yaofang_internal_service.ReturnItemInput'
        type: array
    required:
    - items
    type: object
  internal_handler.splitRequest:
    properties:
      inventory_id:
        type: integer
      packs:
        type: integer
    required:
    - inventory_id
    - packs
    type: object
  internal_handler.splitUnitsRequest:
    properties:
      boxes:
        type: integer
      damaged:
        type: integer
      inventory_id:
        type: integer
      units:
        type: integer
    required:
    - boxes
    - inventory_id
    - units
    type: object
  internal_handler.statusRequest:
    properties:
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - status
    type: object
  internal_handler.stockInRequest:
    properties:
      entries:
        items:
          $ref: '#/definitions/yaofang_internal_service.StockEntry'
        type: array
    required:
    - entries
    type: object
  internal_handler.transferRequest:
    properties:
      from_location_id:
        type: integer
      items:
        items:
          $ref: '#/definitions/yaofang_internal_service.TransferItem'
        type: array
      remarks:
        type: string
      to_location_id:
        type: integer
    required:
    - from_location_id
    - items
    - to_location_id
    type: object
  internal_handler.updateUserRequest:
    properties:
      name:
        type: string
      password:
        type: string
      phone:
        type: string
      role:
        type: string
      status:
        type: integer
    type: object
  yaofang_internal_model.AdverseReaction:
    properties:
      batch_no:
        type: string
      created_at:
        type: string
      drug_id:
        type: integer
      id:
        type: integer
      outcome:
        type: string
      patient_id:
        type: integer
      patient_name:
        type: string
      reaction_desc:
        type: string
      report_date:
        type: string
      reporter:
        type: string
      severity:
        description: 1轻 2中 3重
        type: integer
    type: object
  yaofang_internal_model.AmpouleReturn:
    properties:
      batch_no:
        type: string
      created_at:
        type: string
      drug_id:
        type: integer
      id:
        type: integer
      patient_name:
        type: string
      prescription_id:
        type: integer
      quantity:
        type: integer
      return_date:
        type: string
      returned_by:
        type: string
      status:
        description: pending/verified
        type: string
      verified_by:
        type: string
    type: object
  yaofang_internal_model.Consultation:
    properties:
      answer:
        type: string
      consultant:
        type: string
      consulted_at:
        type: string
      contact:
        type: string
      created_at:
        type: string
      drug_id:
        type: integer
      id:
        type: integer
      patient_id:
        type: integer
      patient_name:
        type: string
      question:
        type: string
    type: object
  yaofang_internal_model.Drug:
    properties:
      antibiotic_level:
        description: 0非抗生素 1非限制 2限制 3特殊
        type: integer
      approval_number:
        type: string
      barcode:
        type: string
      base_unit:
        type: string
      brand_name:
        type: string
      category_id:
        type: integer
      code:
        type: string
      created_at:
        type: string
      dosage_form:
        type: string
      expiry_warning_days:
        type: integer
      generic_name:
        type: string
      id:
        type: integer
      is_frozen:
        type: boolean
      is_split_allowed:
        type: boolean
      manufacturer:
        type: string
      max_daily_dose:
        type: integer
      max_single_dose:
        type: integer
      pack_size:
        type: integer
      psychotropic_level:
        type: integer
      purchase_price:
        type: integer
      py_code:
        type: string
      remarks:
        type: string
      retail_price:
        type: integer
      special_control_type:
        description: 0无 1麻醉 2精神 3毒性 4放射性
        type: integer
      specification:
        type: string
      split_purchase_price:
        type: integer
      split_retail_price:
        type: integer
      split_unit:
        type: string
      status:
        type: integer
      updated_at:
        type: string
    type: object
  yaofang_internal_model.DrugCategory:
    properties:
      code:
        type: string
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      parent_id:
        type: integer
      sort_order:
        type: integer
      status:
        type: integer
      updated_at:
        type: string
    type: object
  yaofang_internal_model.DrugInteraction:
    properties:
      created_at:
        type: string
      description:
        type: string
      drug_a_id:
        type: integer
      drug_b_id:
        type: integer
      id:
        type: integer
      level:
        description: 1禁忌 2慎用 3注意
        type: integer
    type: object
  yaofang_internal_model.InventoryLocation:
    properties:
      code:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      parent_id:
        type: integer
      type:
        type: integer
      updated_at:
        type: string
    type: object
  yaofang_internal_model.MedicationGuidance:
    properties:
      content:
        type: string
      created_at:
        type: string
      drug_id:
        type: integer
      guided_at:
        type: string
      id:
        type: integer
      patient_name:
        type: string
      pharmacist:
        type: string
      prescription_id:
        type: integer
    type: object
  yaofang_internal_model.SpecialDrugLedger:
    properties:
      batch_no:
        type: string
      created_at:
        type: string
      drug_id:
        type: integer
      id:
        type: integer
      log_type:
        description: prescribe/dispense/return/ampoule_return/usage
        type: string
      notes:
        type: string
      operator_id:
        type: integer
      operator_name:
        type: string
      patient_card_no:
        type: string
      patient_name:
        type: string
      prescription_id:
        type: integer
      quantity:
        description: 有符号
        type: integer
    type: object
  yaofang_internal_model.Supplier:
    properties:
      address:
        type: string
      code:
        type: string
      contact_person:
        type: string
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      phone:
        type: string
      qualification_no:
        type: string
      remarks:
        type: string
      status:
        type: integer
      updated_at:
        type: string
    type: object
  yaofang_internal_service.AuditInput:
    properties:
      action:
        description: pass / reject
        type: string
      remarks:
        type: string
    type: object
  yaofang_internal_service.CountedItem:
    properties:
      counted_quantity:
        type: integer
      item_id:
        type: integer
    type: object
  yaofang_internal_service.POItemInput:
    properties:
      drug_id:
        type: integer
      quantity:
        description: 基本单位
        type: integer
      unit_price:
        description: 分/基本单位
        type: integer
    type: object
  yaofang_internal_service.PrescriptionInput:
    properties:
      department:
        type: string
      diagnosis:
        type: string
      doctor_name:
        type: string
      items:
        items:
          $ref: '#/definitions/yaofang_internal_service.PrescriptionItemInput'
        type: array
      patient_age:
        type: string
      patient_card_no:
        type: string
      patient_gender:
        type: string
      patient_name:
        type: string
      prescription_type:
        type: integer
      remarks:
        type: string
    type: object
  yaofang_internal_service.PrescriptionItemInput:
    properties:
      days:
        type: integer
      drug_id:
        type: integer
      frequency:
        type: string
      is_split:
        description: true=强制拆零
        type: boolean
      quantity:
        description: LDU（拆零单位）
        type: integer
      single_dose:
        description: 拆零单位
        type: integer
      total_daily_dose:
        description: 拆零单位
        type: integer
      usage_text:
        type: string
    type: object
  yaofang_internal_service.ReceiveItemInput:
    properties:
      batch_no:
        type: string
      expiry_date:
        type: string
      order_item_id:
        type: integer
      qc_notes:
        type: string
      qc_result:
        description: 1合格 2不合格
        type: integer
      received_quantity:
        description: 基本单位
        type: integer
    type: object
  yaofang_internal_service.ReturnItemInput:
    properties:
      item_id:
        type: integer
      return_quantity:
        description: 与明细同口径
        type: integer
    type: object
  yaofang_internal_service.StockEntry:
    properties:
      batch_no:
        type: string
      drug_id:
        type: integer
      expiry_date:
        type: string
      is_split:
        type: boolean
      location_id:
        type: integer
      quantity:
        type: integer
      unit_price:
        type: integer
    type: object
  yaofang_internal_service.TransferItem:
    properties:
      inventory_id:
        type: integer
      quantity:
        description: 行口径数量
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: 药房进销存与处方调配后端服务
  title: 药房管理系统 API
  version: "1.0"
paths:
  /adverse-reactions:
    get:
      parameters:
      - description: 药品ID
        in: query
        name: drug_id
        type: integer
      - description: 关键字
        in: query
        name: keyword
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数
        in: query
        name: page_size
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 不良反应列表
      tags:
      - adverse-reactions
    post:
      consumes:
      - application/json
      parameters:
      - description: 登记记录
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/yaofang_internal_model.AdverseReaction'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 新建不良反应登记
      tags:
      - adverse-reactions
  /adverse-reactions/{id}:
    delete:
      parameters:
      - description: 登记ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 删除不良反应登记
      tags:
      - adverse-reactions
    put:
      parameters:
      - description: 登记ID
        in: path
        name: id
        required: true
        type: integer
      - description: 登记记录
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/yaofang_internal_model.AdverseReaction'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 更新不良反应登记
      tags:
      - adverse-reactions
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 账号密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      summary: 登录
      tags:
      - auth
  /auth/profile:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 当前用户信息
      tags:
      - auth
  /categories:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 分类列表
      tags:
      - categories
    post:
      consumes:
      - application/json
      parameters:
      - description: 分类
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/yaofang_internal_model.DrugCategory'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 新增分类
      tags:
      - categories
  /categories/{id}:
    delete:
      parameters:
      - description: 分类ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 删除分类
      tags:
      - categories
    put:
      parameters:
      - description: 分类ID
        in: path
        name: id
        required: true
        type: integer
      - description: 分类
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/yaofang_internal_model.DrugCategory'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 更新分类
      tags:
      - categories
  /consultations:
    get:
      parameters:
      - description: 关键字
        in: query
        name: keyword
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数
        in: query
        name: page_size
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 用药咨询列表
      tags:
      - consultations
    post:
      consumes:
      - application/json
      parameters:
      - description: 咨询记录
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/yaofang_internal_model.Consultation'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 新建用药咨询
      tags:
      - consultations
  /consultations/{id}:
    delete:
      parameters:
      - description: 咨询ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 删除用药咨询
      tags:
      - consultations
    put:
      parameters:
      - description: 咨询ID
        in: path
        name: id
        required: true
        type: integer
      - description: 咨询记录
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/yaofang_internal_model.Consultation'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 更新用药咨询
      tags:
      - consultations
  /drug-suppliers/{id}:
    delete:
      parameters:
      - description: 关系ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 删除供货关系
      tags:
      - suppliers
  /drugs:
    get:
      parameters:
      - description: 关键字
        in: query
        name: keyword
        type: string
      - description: 分类
        in: query
        name: category_id
        type: integer
      - description: 抗生素分级
        in: query
        name: antibiotic_level
        type: integer
      - description: 特殊管制类型
        in: query
        name: special_control_type
        type: integer
      - description: 状态
        in: query
        name: status
        type: integer
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数
        in: query
        name: page_size
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 药品列表
      tags:
      - drugs
    post:
      consumes:
      - application/json
      parameters:
      - description: 药品信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/yaofang_internal_model.Drug'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 新增药品
      tags:
      - drugs
  /drugs/{id}:
    delete:
      parameters:
      - description: 药品ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 删除药品（有下游自动冻结）
      tags:
      - drugs
    get:
      parameters:
      - description: 药品ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 药品详情
      tags:
      - drugs
    put:
      consumes:
      - application/json
      parameters:
      - description: 药品ID
        in: path
        name: id
        required: true
        type: integer
      - description: 药品信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/yaofang_internal_model.Drug'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 更新药品
      tags:
      - drugs
  /drugs/{id}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: 药品ID
        in: path
        name: id
        required: true
        type: integer
      - description: 状态
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.statusRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 启停用药品
      tags:
      - drugs
  /drugs/{id}/suppliers:
    get:
      parameters:
      - description: 药品ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 药品供货关系列表
      tags:
      - suppliers
    post:
      consumes:
      - application/json
      parameters:
      - description: 药品ID
        in: path
        name: id
        required: true
        type: integer
      - description: 关系信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.bindDrugSupplierRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 绑定药品-供应商关系
      tags:
      - suppliers
  /interactions:
    get:
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数
        in: query
        name: page_size
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.Body'
      security:
      - BearerAuth: []
      summary: 配伍禁忌列表
      tags:
      - interactions
    post:
      consumes:
      - application/json
      parameters:
