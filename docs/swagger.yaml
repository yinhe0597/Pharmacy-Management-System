basePath: /api/v1
definitions:
  internal_handler.Body:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  internal_handler.adjustRequest:
    properties:
      inventory_id:
        type: integer
      quantity:
        type: integer
      reason:
        type: string
    required:
    - inventory_id
    - quantity
    type: object
  internal_handler.bindDrugSupplierRequest:
    properties:
      is_default:
