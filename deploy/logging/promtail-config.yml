# Promtail 采集配置：抓取 Docker 容器 stdout 日志 → 推送 Loki
# 仅采集本服务相关容器（compose 项目名过滤），避免收进无关容器日志。
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ── Docker 容器日志（docker_sd：发现本机全部容器，按 label 过滤）──
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # 只采集本项目容器（docker compose 默认 project 标签；按需改为你的项目名）
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: 'yaofang'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container_name'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'

  # ── 裸机场景：journald 采集（无 Docker 时启用，需挂载 /var/log/journal）
  # 将上方 promtail 容器 volumes 增加 "- /var/log/journal:/var/log/journal:ro"
  # - job_name: journal
  #   journal:
  #     path: /var/log/journal
  #     max_age: 12h
  #   relabel_configs:
  #     - source_labels: ['__journal__systemd_unit']
  #       target_label: 'unit'

  # ── 裸机场景：文件采集（应用 log.file 输出 /var/log/yaofang/yaofang.log 时启用）
  # - job_name: yaofang-files
  #   static_configs:
  #     - targets: [localhost]
  #       labels:
  #         job: yaofang
  #         __path__: /var/log/yaofang/*.log
