# 前端 Deployment（Nginx 托管 SPA + /api 反代到后端 Service）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yaofang-web
  namespace: yaofang
  labels:
    app: yaofang-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yaofang-web
  template:
    metadata:
      labels:
        app: yaofang-web
    spec:
      containers:
        - name: web
          image: registry.example.com/yaofang-web:latest  # 替换为你的镜像地址
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: API_UPSTREAM
              value: "yaofang-api:8080"   # Nginx 模板替换：/api 反代到后端 Service
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
