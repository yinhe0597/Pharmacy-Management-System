# 敏感配置（占位值，生产必须替换，勿提交真实密钥！）
# 生成随机密钥：openssl rand -base64 48
apiVersion: v1
kind: Secret
metadata:
  name: yaofang-api-secret
  namespace: yaofang
type: Opaque
stringData:
  YF_DATABASE_USER: "yaofang"
  YF_DATABASE_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  YF_AUTH_JWT_SECRET: "CHANGE_ME_32chars_minimum_random_string"
