# Nginx 配置模板：容器启动时由官方镜像入口 envsubst 将 ${API_UPSTREAM} 替换为实际后端地址
# （compose 中注入，如 api:8080 / backend:8080）。SPA 路由回退 index.html，/api/* 反代后端。
upstream yaofang_backend {
    server ${API_UPSTREAM};
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 静态资源长缓存（文件名带 hash）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # API 同源反代（内网浏览器直访无需 CORS）
    location /api/ {
        proxy_pass http://yaofang_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 探活（供编排/负载均衡使用）
    # 注意：Swagger 文档端点仅在非 release 模式由后端注册，生产（release）不反代 /swagger/，
    # 避免对外暴露完整接口契约。
    location = /healthz {
        proxy_pass http://yaofang_backend;
    }
    location = /readyz {
        proxy_pass http://yaofang_backend;
    }

    # SPA 路由回退（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
