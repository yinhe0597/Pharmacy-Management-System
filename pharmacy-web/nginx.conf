# Nginx 配置模板：容器启动时由官方镜像入口 envsubst 将 ${API_UPSTREAM} 替换为实际后端地址
# （compose 中注入，如 api:8080 / backend:8080）。SPA 路由回退 index.html，/api/* 反代后端。
#
# 网关层登录限速：后端自身的登录限速为**进程内计数**（多副本部署时阈值随副本数放大、
# 重启即清零），此处按真实客户端 IP 再兜一层（10 次/分钟 + 突发 5）。
# 说明：若本容器前还有一层代理/CDN，$binary_remote_addr 取到的是上一层地址，
# 此时应改为基于可信代理链解析（set_real_ip_from + real_ip_header）后再限速。
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_status 429;

upstream yaofang_backend {
    server ${API_UPSTREAM};
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # 浏览器安全头（SPA + API 反代共用）。静态资源 location 自带 add_header，
    # 会覆盖本级继承，须在该 location 内重复声明。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 静态资源长缓存（文件名带 hash）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri =404;
    }

    # API 同源反代（内网浏览器直访无需 CORS）
    location /api/ {
        proxy_pass http://yaofang_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 登录端点：网关层限速（精确匹配优先于 /api/ 前缀匹配）
    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://yaofang_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 探活（供编排/负载均衡使用）
    # 注意：Swagger 文档端点仅在非 release 模式由后端注册，生产（release）不反代 /swagger/，
    # 避免对外暴露完整接口契约。
    location = /healthz {
        proxy_pass http://yaofang_backend;
    }
    location = /readyz {
        proxy_pass http://yaofang_backend;
    }

    # SPA 路由回退（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
